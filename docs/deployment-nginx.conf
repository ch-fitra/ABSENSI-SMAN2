# Ganti nama domain, lokasi aplikasi, dan socket PHP sesuai server.
server {
    listen 80;
    server_name absensi.example.sch.id;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name absensi.example.sch.id;
    root /var/www/absensi/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/absensi.example.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/absensi.example.sch.id/privkey.pem;
    charset utf-8;
    client_max_body_size 3m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
